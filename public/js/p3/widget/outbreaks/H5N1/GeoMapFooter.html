<div style="display: flex; flex-direction: column; gap: 6px;">
    <div style="display: flex; align-items: flex-start;">
        <div style="width: 10px; height: 10px; background-color: #035999; margin-right: 6px; margin-top: 2px; flex: none;"></div>
        <span>Cases in humans and other hosts (# of human cases / # of other hosts' cases)</span>
    </div>
    <div style="display: flex; align-items: center;">
        <div style="width: 10px; height: 10px; background-color: #028c81; margin-right: 6px; flex: none;"></div>
        <span>Cases in non-human hosts</span>
    </div>
    <div style="display: flex; align-items: center;">
        <div style="width: 11px; height: 15px; flex: none;">
            <div style="width: 100%; height: 100%; background-color: #035999; clip-path: polygon(50% 100%, 100% 50%, 50% 0%, 0% 50%);"></div>
        </div>
        <div style="width: 11px; height: 15px; margin-right: 6px; flex: none;">
            <div style="width: 100%; height: 100%; background-color: #028c81; clip-path: polygon(50% 100%, 100% 50%, 50% 0%, 0% 50%);"></div>
        </div>
        <span>Country-level cases</span>
    </div>
    <div style="display: flex; align-items: center;">
        <div style="width: 10px; height: 10px; background-color: #035999; border-radius: 50%; flex: none;"></div>
        <div style="width: 10px; height: 10px; background-color: #028c81; border-radius: 50%; margin-left: 2px; margin-right: 6px; flex: none;"></div>
        <span>State-level cases</span>
    </div>
</div>
