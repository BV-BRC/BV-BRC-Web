<div class="ogm-layout">
    <style>
      /* ── Layout shell ─────────────────────────────────────────── */
      .ogm-layout {
        padding: 0 8px;
      }

      .ogm-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin: 10px 0 6px;
        flex-wrap: wrap;
      }

      .ogm-controls {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      /* ── Segmented US/Global toggle ───────────────────────────── */
      .ogm-toggle-group {
        display: inline-flex;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        overflow: hidden;
        background: #fff;
      }

      .ogm-toggle-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 5px 12px;
        font-size: 12.5px;
        font-weight: 600;
        color: #374151;
        cursor: pointer;
        user-select: none;
        line-height: 1.1;
        min-width: 80px;
        border-right: 1px solid #d1d5db;
        transition: background .12s, color .12s;
      }

      .ogm-toggle-btn:last-child {
        border-right: 0;
      }

      .ogm-toggle-btn:hover {
        background: #eef2f7;
        color: #2c7a7b;
      }

      .ogm-toggle-btn.is-active {
        background: #2c7a7b;
        color: #fff;
      }

      .ogm-toggle-btn.is-active:hover {
        background: #236163;
        color: #fff;
      }

      .ogm-toggle-btn .dijitRadio {
        position: absolute;
        opacity: 0;
        pointer-events: none;
        width: 0;
        height: 0;
      }

      .ogm-toggle-count {
        font-size: 10.5px;
        font-weight: 700;
        padding: 1px 6px;
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.08);
        color: inherit;
        min-width: 18px;
        text-align: center;
        font-variant-numeric: tabular-nums;
      }

      .ogm-toggle-btn.is-active .ogm-toggle-count {
        background: rgba(255, 255, 255, 0.22);
      }

      /* ── Reset Map + Info icon ───────────────────────────────── */
      .ogm-reset-btn {
        height: 26px;
        padding: 0 12px;
        border-radius: 4px;
        background: #fff;
        border: 1px solid #d1d5db;
        cursor: pointer;
        user-select: none;
        font-size: 12px;
        font-weight: 600;
        color: #374151;
        line-height: 1;
        white-space: nowrap;
        transition: background .12s, border-color .12s, color .12s;
      }

      .ogm-reset-btn:hover {
        background: #eef2f7;
        border-color: #2c7a7b;
        color: #2c7a7b;
      }

      .ogm-icon-btn {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 1px solid #d1d5db;
        background: #fff;
        cursor: pointer;
        font-family: Georgia, serif;
        font-style: italic;
        font-size: 13px;
        font-weight: 700;
        color: #6b7280;
        line-height: 1;
        padding: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .ogm-icon-btn:hover {
        background: #eef2f7;
        border-color: #2c7a7b;
        color: #2c7a7b;
      }

      .ogm-icon-btn.is-active {
        background: #2c7a7b;
        border-color: #2c7a7b;
        color: #fff;
      }

      /* ── Info popover ────────────────────────────────────────── */
      .ogm-info-popover {
        position: relative;
        margin: 0 0 10px;
        padding: 10px 32px 10px 14px;
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 6px;
        box-shadow: 0 2px 8px rgba(15, 30, 55, 0.08);
        font-size: 13px;
        line-height: 1.5;
        color: #374151;
      }

      .ogm-info-popover[hidden] {
        display: none;
      }

      .ogm-info-popover p {
        margin: 0;
      }

      .ogm-popover-close {
        position: absolute;
        top: 4px;
        right: 6px;
        background: none;
        border: 0;
        font-size: 18px;
        line-height: 1;
        color: #9ca3af;
        cursor: pointer;
        padding: 2px 6px;
      }

      .ogm-popover-close:hover {
        color: #2c7a7b;
      }

      /* ── Stat chips ──────────────────────────────────────────── */
      .ogm-stats {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 0 0 8px;
      }

      .ogm-stat-chip {
        display: inline-flex;
        align-items: baseline;
        gap: 5px;
        padding: 4px 10px;
        border-radius: 999px;
        background: #f3f4f6;
        border: 1px solid #e5e7eb;
        font-size: 12px;
        color: #374151;
      }

      .ogm-stat-chip-num {
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        color: #0f1f1f;
      }

      .ogm-stat-chip-label {
        color: #6b7280;
      }

      /* ── Canvas ──────────────────────────────────────────────── */
      .ogm-canvas {
        width: 100%;
        height: 600px;
        margin: 8px 0 10px;
        border: 1px solid #e5e7eb;
        border-radius: 4px;
        overflow: hidden;
      }

      /* ── Leaflet legend control ──────────────────────────────── */
      .leaflet-control.ogm-legend {
        background: rgba(255, 255, 255, 0.95);
        border: 1px solid #e5e7eb;
        border-radius: 6px;
        box-shadow: 0 2px 6px rgba(15, 30, 55, 0.10);
        padding: 8px 10px;
        font-size: 12px;
        line-height: 1.4;
        color: #374151;
        max-width: 280px;
      }

      /* ── Marker cluster overrides ─────────────────────────────── */
      .marker-cluster-outbreaks {
        background-clip: padding-box;
        border-radius: 50%;
      }

      .marker-cluster-outbreaks div {
        width: 30px;
        height: 30px;
        margin-left: 5px;
        margin-top: 5px;
        text-align: center;
        border-radius: 50%;
        color: #fff;
        font-weight: 700;
        font: 12px/30px "Helvetica Neue", Arial, sans-serif;
      }

      .marker-cluster-outbreaks-sm {
        background: rgba(44, 122, 123, 0.5);
      }

      .marker-cluster-outbreaks-sm div {
        background: rgba(44, 122, 123, 0.85);
      }

      .marker-cluster-outbreaks-md {
        background: rgba(230, 138, 0, 0.55);
      }

      .marker-cluster-outbreaks-md div {
        background: rgba(230, 138, 0, 0.9);
      }

      .marker-cluster-outbreaks-lg {
        background: rgba(214, 39, 40, 0.55);
      }

      .marker-cluster-outbreaks-lg div {
        background: rgba(214, 39, 40, 0.9);
      }

      /* ── Popup styling ──────────────────────────────────────── */
      .leaflet-popup-content-wrapper {
        border-radius: 10px !important;
        padding: 0 !important;
        box-shadow: 0 10px 30px rgba(15, 30, 55, 0.22) !important;
        border: 1px solid #e5e7eb;
        overflow: hidden;
      }

      .leaflet-popup-content {
        margin: 0 !important;
        width: 320px !important;
        max-width: 360px;
        line-height: 1.45;
      }

      .leaflet-popup-tip {
        box-shadow: 0 4px 14px rgba(15, 30, 55, 0.18) !important;
      }

      .leaflet-popup .leaflet-popup-close-button {
        display: none !important;
      }

      .sdm-pop {
        font: 13px/1.45 "Helvetica Neue", Arial, sans-serif;
        color: #1f2937;
      }

      .sdm-pop-header {
        background: linear-gradient(135deg, #f3f7f7 0%, #e8f1f1 100%);
        padding: 12px 16px;
        border-bottom: 1px solid #e5e7eb;
      }

      .sdm-pop-eyebrow {
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: .08em;
        color: #9ca3af;
        margin-bottom: 2px;
      }

      .sdm-pop-location {
        font-weight: 700;
        font-size: 14px;
        color: #0f1f1f;
        letter-spacing: -0.01em;
        word-break: break-word;
      }

      .sdm-pop-body {
        padding: 12px 16px 14px;
        max-height: 320px;
        overflow-y: auto;
      }

      .sdm-pop-section-title {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: .08em;
        color: #9ca3af;
        margin: 2px 0 8px;
      }

      .sdm-pop-section-title > .sdm-pop-link {
        flex: none;
        white-space: nowrap;
      }

      .sdm-pop-link {
        color: #2c7a7b;
        text-decoration: none;
        font-weight: 600;
        font-size: 11.5px;
      }

      .sdm-pop-link:hover {
        text-decoration: underline;
      }

      .sdm-pop-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }

      .sdm-pop-table th {
        text-align: left;
        font-weight: 700;
        color: #6b7280;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: .06em;
        border-bottom: 1px solid #eef0f2;
        padding: 6px;
        background: #fafbfc;
      }

      .sdm-pop-table td {
        padding: 6px;
        border-bottom: 1px solid #f4f5f7;
        color: #374151;
      }

      .sdm-pop-table tr:last-child td {
        border-bottom: 0;
      }

      .sdm-pop-table .sdm-pop-num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      .sdm-pop-table tbody tr:hover {
        background: #fafbfc;
      }

      .sdm-pop-helper {
        font-size: 12px;
        color: #6b7280;
        margin: 0 0 10px;
      }
    </style>

    <div class="section far2x" id="geomap-section">
        <div class="ogm-header">
            <div class="ogm-stats" data-dojo-attach-point="statsNode"></div>
            <div class="ogm-controls">
                <div class="ogm-toggle-group" role="group" aria-label="Map scope">
                    <label class="ogm-toggle-btn is-active" data-dojo-attach-point="us_map_btn"
                           for="${id}_us_map"
                           data-dojo-attach-event="onclick:_selectUsMap">
                        <input type="radio" data-dojo-type="dijit/form/RadioButton"
                               id="${id}_us_map" name="mapType_${id}" value="us_map"
                               data-dojo-attach-point="us_map"
                               data-dojo-attach-event="onChange:onMapTypeChange" checked/>
                        US Map
                        <span class="ogm-toggle-count" data-dojo-attach-point="us_map_count" hidden>0</span>
                    </label>
                    <label class="ogm-toggle-btn" data-dojo-attach-point="global_map_btn"
                           for="${id}_global_map"
                           data-dojo-attach-event="onclick:_selectGlobalMap">
                        <input type="radio" data-dojo-type="dijit/form/RadioButton"
                               id="${id}_global_map" name="mapType_${id}" value="global_map"
                               data-dojo-attach-point="global_map"
                               data-dojo-attach-event="onChange:onMapTypeChange"/>
                        Global Map
                        <span class="ogm-toggle-count" data-dojo-attach-point="global_map_count" hidden>0</span>
                    </label>
                </div>
                <button type="button" class="ogm-reset-btn"
                        data-dojo-attach-event="onClick:resetMapToDefault"
                        title="Reset map to the default view">Reset Map
                </button>
                <button type="button" class="ogm-icon-btn" data-dojo-attach-point="infoToggleNode"
                        data-dojo-attach-event="onClick:_toggleInfoPopover"
                        title="About this map" aria-label="About this map">i
                </button>
            </div>
        </div>

        <div class="ogm-info-popover" data-dojo-attach-point="infoPopoverNode" hidden>
            <div data-dojo-attach-point="infoPopoverContentNode"></div>
            <button type="button" class="ogm-popover-close"
                    data-dojo-attach-event="onClick:_toggleInfoPopover"
                    aria-label="Close">&times;
            </button>
        </div>

        <div id="outbreaksGeoMapCanvas" class="ogm-canvas">
            Loading Map of Seq. Isolates...
        </div>
    </div>
</div>
