<div class="sdm-pop">
    <div class="sdm-pop-header">
        <div class="sdm-pop-eyebrow">Measles 2025</div>
        <div class="sdm-pop-location">{{ location }}</div>
    </div>

    <div class="sdm-pop-body">
        <div class="sdm-pop-section-title">
            Subclades at this location
            <a class="sdm-pop-link"
               href='/view/Taxonomy/11234#view_tab=genomes&filter=and(or(eq(genome_status,"Complete"),eq(genome_status,"Partial")),or(eq(collection_year,"2025"),eq(collection_year,"2026")){{ locationFilter }})&defaultColumns=-cds,subclade,collection_date&defaultSort=genome_name,subclade'
               target="_blank">View all records &rarr;</a>
        </div>
        <table class="sdm-pop-table">
            <thead>
            <tr>
                <th>Subclade</th>
                <th class="sdm-pop-num">Count</th>
            </tr>
            </thead>
            <tbody data-dojo-attach-point="cladeDetailsPoint"></tbody>
        </table>
    </div>
</div>
