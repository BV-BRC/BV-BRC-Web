name: Hotfix
on:
  workflow_dispatch:
    inputs:
      hotfix_message:
        description: 'Hotfix description (what is being fixed)'
        required: true
        type: string
      version:
        description: 'Explicit X.Y.Z version, no leading v (optional; defaults to master patch + 1, and must be below alpha)'
        required: false
        type: string

jobs:
  create-hotfix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Compute hotfix version
        id: bump
        env:
          EXPLICIT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          MASTER_VERSION=$(node -p "require('./package.json').version")
          git show origin/alpha:package.json > /tmp/alpha-package.json
          ALPHA_VERSION=$(node -p "require('/tmp/alpha-package.json').version")
          echo "master=$MASTER_VERSION alpha=$ALPHA_VERSION explicit=${EXPLICIT_VERSION:-<none>}"

          # Pick the version to release: master's own patch bump.
          #
          # SemVer has no separate notation for a hotfix -- the patch component IS
          # the hotfix component, so a fix to 3.59.12 ships as 3.59.13. Neither
          # extension mechanism works as a substitute: a prerelease suffix
          # (3.59.12-1) sorts BEFORE 3.59.12, and build metadata (3.59.12+hotfix.1)
          # is ignored for precedence and compares EQUAL to the release it fixes.
          #
          # The previous revision bumped "the higher of master and alpha", which
          # dragged alpha's number into a master-lane decision and manufactured the
          # collision it was trying to avoid. Master owns its own patch lane; alpha
          # is never consulted except to check the lane invariant below.
          #
          # Versions go in as argv, never interpolated into the script body. The
          # original revision built the comparison out of shell interpolation and
          # emitted the return value of process.stdout.write() -- the boolean true --
          # whenever the two versions were equal, yielding "3.59.12true".
          VERSION=$(node -e '
            const [master, alpha, explicit] = process.argv.slice(1);

            const parts = (v) => v.split(".").map(Number);
            const cmp = (a, b) => {
              const [x, y] = [parts(a), parts(b)];
              const n = Math.max(x.length, y.length);
              for (let i = 0; i < n; i++) {
                const d = (x[i] || 0) - (y[i] || 0);
                if (d) return d;
              }
              return 0;
            };

            const bump = (v) => {
              const p = parts(v);
              p[2]++;
              return [p[0], p[1], p[2]].join(".");
            };

            const version = explicit || bump(master);

            // Strict three-part SemVer. Four-part versions are not valid SemVer and
            // npm silently mis-parses them: `npm version 3.59.12.1` stores
            // 3.59.1-2.1 and exits 0.
            if (!/^\d+\.\d+\.\d+$/.test(version)) {
              console.error("Refusing to release " + version + ": not a three-part X.Y.Z version");
              process.exit(1);
            }
            if (cmp(version, master) <= 0) {
              console.error("Refusing to release " + version + ": not greater than master " + master);
              process.exit(1);
            }

            // Lane invariant: master holds the lower line, alpha the higher one.
            // Bump alpha to a new version line BEFORE cutting a hotfix, or the
            // hotfix number collides with what alpha will release next.
            if (cmp(version, alpha) >= 0) {
              console.error("Refusing to release " + version + ": alpha is at " + alpha + ".");
              console.error("");
              console.error("The hotfix version must be strictly below alpha, so that the");
              console.error("number cannot collide with alpha's next release. Bump alpha to a");
              console.error("new version line first (Release workflow, minor), then re-run.");
              process.exit(1);
            }

            process.stdout.write(version);
          ' "$MASTER_VERSION" "$ALPHA_VERSION" "${EXPLICIT_VERSION:-}")

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing hotfix v$VERSION"

      - name: Write version and create hotfix branch
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail

          # Written directly rather than through `npm version`, which would compute
          # its own bump from package.json and re-derive a number the step above
          # already decided (and already validated against the lane invariant).
          # This writes the agreed version verbatim, keeps package-lock's
          # packages[""] entry in sync, and preserves the file's indentation so the
          # diff is exactly the version lines.
          node -e '
            const fs = require("fs");
            const version = process.argv[1];
            for (const f of ["package.json", "package-lock.json"]) {
              const raw = fs.readFileSync(f, "utf8");
              const o = JSON.parse(raw);
              o.version = version;
              if (o.packages && o.packages[""]) o.packages[""].version = version;
              const indent = /^\{\n(\s+)/.exec(raw)?.[1].length || 2;
              fs.writeFileSync(f, JSON.stringify(o, null, indent) + "\n");
            }
          ' "$VERSION"

          git checkout -b "hotfix/v${VERSION}"
          git add package.json package-lock.json
          git commit -m "Hotfix v${VERSION}

          ${{ inputs.hotfix_message }}"

      - name: Push branch and create PR
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
          HOTFIX_MESSAGE: ${{ inputs.hotfix_message }}
        run: |
          set -euo pipefail

          # Remove any leftover branch from a failed previous run.
          git push origin --delete "hotfix/v${VERSION}" 2>/dev/null || true
          git push -u origin "hotfix/v${VERSION}"

          {
            echo "## Hotfix v${VERSION}"
            echo
            echo "${HOTFIX_MESSAGE}"
            echo
            echo "---"
            echo "**Next steps:**"
            echo "1. Check out this branch locally: \`git fetch origin && git checkout hotfix/v${VERSION}\`"
            echo "2. Make your fix commits"
            echo "3. Push your changes: \`git push\`"
            echo "4. Merge this PR when ready"
            echo
            echo "*After merging, a tag will be created and the changes cherry-picked to alpha and beta.*"
          } > /tmp/hotfix-body.md

          gh pr create --base master --head "hotfix/v${VERSION}" \
            --title "Hotfix v${VERSION}" \
            --body-file /tmp/hotfix-body.md
