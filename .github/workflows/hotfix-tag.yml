name: Tag Hotfix
on:
  pull_request:
    types: [closed]
    branches: [master]

jobs:
  tag-hotfix:
    # Only run if PR was merged and branch name starts with hotfix/v
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'hotfix/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        id: tag
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          # hotfix/vX.Y.Z -> vX.Y.Z
          VERSION="${HEAD_REF#hotfix/}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists, skipping tag creation"
          else
            git tag -a "$VERSION" -m "$PR_TITLE"
            git push origin "$VERSION"
            echo "Created and pushed tag: $VERSION"
          fi

  # One independent leg per downstream branch. Previously alpha and beta were two
  # steps in a single job, so any alpha failure skipped beta entirely -- and alpha
  # failed on every run this workflow has ever had. fail-fast is off so one leg
  # failing no longer hides the other.
  cherry-pick:
    needs: tag-hotfix
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        target: [alpha, beta]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Cherry-pick to ${{ matrix.target }}
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_EDITOR: 'true'
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.tag-hotfix.outputs.version }}
          MERGE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          BRANCH="cherry-pick/hotfix-${VERSION}-${TARGET}"

          git fetch origin "$TARGET"

          # A hotfix is frequently ALREADY on a downstream branch: the common case
          # is a fix developed on alpha, merged there, and then brought to master
          # out of band so it reaches production without waiting for the release
          # train. Propagating it back is at best redundant and at worst harmful --
          # the master copy may be an ADAPTED version of the original (v3.59.14
          # kept master's inline authorization-header idiom, because alpha's
          # auth/authHeaders module does not exist on that lane), so applying it to
          # alpha would revert the newer branch.
          #
          # Today that attempt happens to conflict and the leg fails red. That is
          # the right outcome by luck, not design: it holds only while the
          # adaptation touches a file outside the manifest auto-resolve below. An
          # adaptation confined to package.json would apply silently and revert the
          # target. A red X on every hotfix also teaches everyone to ignore this
          # workflow's status, which is how the last breakage stayed invisible.
          #
          # Patch-id comparison (git cherry) cannot answer this: the adapted commit
          # is a genuinely different patch from the original, so it reports "not
          # present" for a branch that very much has the fix. Verified on v3.59.14
          # -- the alpha commit and its master adaptation have different patch-ids.
          # The provenance has to be stated rather than inferred, hence a trailer
          # on the hotfix PR description (the template asks for it):
          #
          #     Cherry-picked-from: <sha>
          #
          # If that commit is an ancestor of the target, the fix is already there.
          ORIGIN_SHA=$(git log -1 --format=%B "$MERGE_COMMIT" |
            sed -n 's/^Cherry-picked-from:[[:space:]]*\([0-9a-f]\{7,40\}\).*/\1/p' | head -1)

          if [ -n "$ORIGIN_SHA" ] && git rev-parse --verify --quiet "${ORIGIN_SHA}^{commit}" >/dev/null &&
              git merge-base --is-ancestor "$ORIGIN_SHA" "origin/${TARGET}"; then
            echo "Hotfix ${VERSION} originated at ${ORIGIN_SHA}, which is already on ${TARGET}."
            echo "Nothing to propagate; skipping."
            exit 0
          fi

          git checkout -B "$BRANCH" "origin/${TARGET}"

          # -m 1 selects the mainline parent and is only meaningful for a merge
          # commit. A squash- or rebase-merged PR lands on master as an ordinary
          # one-parent commit; all three merge methods are enabled on this repo, so
          # both shapes really occur. Older git errors on -m for a non-merge commit.
          PARENTS=$(git rev-list --parents -n1 "$MERGE_COMMIT" | wc -w)
          if [ "$PARENTS" -gt 2 ]; then
            MAINLINE="-m 1"
          else
            MAINLINE=""
          fi

          # shellcheck disable=SC2086
          if git cherry-pick -x $MAINLINE "$MERGE_COMMIT"; then
            echo "Cherry-pick applied cleanly."
          elif [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            # The hotfix version bump must never propagate: alpha and beta are on a
            # higher version line than master, so the manifests always collide.
            # Resolve those two in favour of the target branch and keep going.
            for f in package.json package-lock.json; do
              if git diff --name-only --diff-filter=U | grep -qx "$f"; then
                git checkout --ours -- "$f"
                git add -- "$f"
              fi
            done

            REMAINING="$(git diff --name-only --diff-filter=U)"
            if [ -n "$REMAINING" ]; then
              git cherry-pick --abort
              echo "::error::Hotfix ${VERSION} conflicts with ${TARGET} in: $(echo "$REMAINING" | tr '\n' ' ')"
              echo "Resolve by hand:"
              echo "  git fetch origin && git checkout -b ${BRANCH} origin/${TARGET}"
              echo "  git cherry-pick -x ${MAINLINE} ${MERGE_COMMIT}"
              echo "  # resolve, then: git cherry-pick --continue && git push -u origin ${BRANCH}"
              exit 1
            fi

            # Everything that conflicted was a manifest. If that is all the commit
            # touched, the cherry-pick is now empty and --continue refuses it.
            git cherry-pick --continue || git cherry-pick --skip
          else
            # Not a conflict, so the change is already present on the target and the
            # cherry-pick produced nothing. The old workflow called --abort here and
            # then unconditionally ran `gh pr create`, which failed with "No commits
            # between ..." and, under bash -e, took the rest of the job with it.
            echo "Cherry-pick is empty: hotfix ${VERSION} is already on ${TARGET}."
            git cherry-pick --skip || git cherry-pick --quit
          fi

          # Drop any version bump that applied without conflicting.
          git checkout "origin/${TARGET}" -- package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi

          if git diff --quiet "origin/${TARGET}" HEAD; then
            echo "Nothing to propagate to ${TARGET}; not opening a PR."
            exit 0
          fi

          git push -u --force-with-lease origin "$BRANCH"

          if [ -n "$(gh pr list --base "$TARGET" --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "A PR for ${BRANCH} is already open; pushed the update to it."
            exit 0
          fi

          {
            echo "## Cherry-pick Hotfix ${VERSION} to ${TARGET}"
            echo
            echo "This PR cherry-picks the hotfix from master to ${TARGET}."
            echo
            echo "Original PR: #${PR_NUMBER}"
            echo "Merge commit: ${MERGE_COMMIT}"
            echo
            echo "The version bump from the hotfix is deliberately excluded: ${TARGET} is on"
            echo "its own, higher version line."
            echo
            echo "---"
            echo "*This PR was created automatically by the hotfix-tag workflow.*"
          } > /tmp/cherry-pick-body.md

          gh pr create --base "$TARGET" --head "$BRANCH" \
            --title "Cherry-pick: Hotfix ${VERSION} to ${TARGET}" \
            --body-file /tmp/cherry-pick-body.md

  delete-branch:
    needs: [tag-hotfix, cherry-pick]
    # The hotfix branch is already merged into master, so deleting it is safe even
    # if a cherry-pick leg failed. Without always(), a failed leg leaves the branch
    # behind and the next run of the same version trips over it.
    if: always() && needs.tag-hotfix.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete hotfix branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/${BRANCH}" || true
          echo "Deleted branch: $BRANCH"
