# CI: install deps and verify the server module graph loads on every Node
# version this app has to run on. See https://github.com/actions/setup-node
#
# This exists specifically to catch require()/ESM breakage. Production runs
# Node 22, which cannot require() an ESM-only module, while dev often runs
# Node 24+ (which can). A dependency bump that pulls an ESM-only transitive
# then loads fine in dev but crashes prod on startup (e.g. sanitize-html
# 2.17.6 -> htmlparser2 12, which is ESM-only). Loading app.js on Node 22
# here reproduces that failure in CI instead of in production.
#
# 24.x is tested alongside 22.x ahead of the planned production upgrade.
# Production runs every Node service from a single pm2 ecosystem.js, so the
# move is all-at-once for the whole fleet rather than service by service --
# there is no way to stage it, which makes "is 24 green?" something worth
# knowing well before the maintenance window rather than during it.
#
# Note the upgrade direction is the forgiving one: 24 can require() ESM, so
# it REMOVES the failure mode above rather than adding one. The real risks
# are native modules needing a rebuild for the new ABI, and services whose
# package.json declares no `engines` and so records no tested version.
#
# When production is on 24, drop 22.x from the matrix.

name: CI

on:
  push:
    branches: [ alpha, beta, master ]
  pull_request:
    branches: [ alpha, beta, master ]

jobs:
  build:
    # Names the run "Node 22.x" / "Node 24.x" in the checks list, so a
    # failure says which version broke without opening the logs.
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      # Report both versions rather than stopping at the first failure:
      # "fails on 24, passes on 22" and "fails on both" mean different
      # things, and the difference is the whole point of the matrix.
      fail-fast: false
      matrix:
        # 22.x is production today; 24.x is where it is going.
        node-version: [ 22.x, 24.x ]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Before npm ci, so it still runs if the install breaks. The release and
      # hotfix workflows are dispatched by hand and never exercised on a PR, so
      # a shell syntax error in one of them otherwise surfaces only when it is
      # needed. No dependencies -- plain node plus bash -n.
      - name: Workflow shell syntax
        run: node .github/scripts/check-workflow-shell.js

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Smoke test — server module graph loads (catches require/ESM breakage)
        run: node -e "require('./app.js'); console.log('server module graph loaded OK')"

      - name: Unit tests
        run: npm test
